# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-send"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-send"
description = "Xmip Send Ports and Send Port Groups, and the chain that resolves the identity a Send Location presents."

[dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[profile.dev.package."*"]
opt-level = 3
